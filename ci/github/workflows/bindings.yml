name: bindings-smoke
on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build core
        run: |
          cmake -S . -B build -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release
      - name: Python smoke test
        run: |
          export SPEEDUP_LIB="$PWD/build/libspeedup.so"
          python bindings/python/smoke_test.py

  java-bucketization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bucketization tests
        run: mvn -B -f bindings/java/bucketization/pom.xml test
